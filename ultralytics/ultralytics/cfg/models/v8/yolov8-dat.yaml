# YOLOv8 + C2f_DAttention (DAT backbone integration)
#
# Replaces C2f at the two deepest backbone stages (P4/P5) with C2fDAttn,
# which inserts a Deformable Attention module inside the last bottleneck.
#
# Source:
#   "Improved YOLOv8 for Road Damage Detection" — Discover Applied Sciences 2024
#   Xia et al. "Vision Transformer with Deformable Attention" — CVPR 2022
#
# Scales (use model=yolov8-dat-n.yaml  OR  model=yolov8-dat.yaml  scale='n'):
#   n  → CPU validation / smoke test
#   m  → Kaggle thesis training

nc: 5  # RDD2022: longitudinal_crack, transverse_crack, alligator_crack, other_corruption, pothole

scales:
  # [depth_multiple, width_multiple, max_channels]
  n: [0.33, 0.25, 1024]   # YOLOv8n-DAT  — fast CPU validation
  s: [0.33, 0.50, 1024]   # YOLOv8s-DAT
  m: [0.67, 0.75,  768]   # YOLOv8m-DAT  — thesis Kaggle run

# YOLOv8 backbone with C2fDAttn replacing C2f at P4 and P5
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,     [64, 3, 2]]        # 0  P1/2
  - [-1, 1, Conv,     [128, 3, 2]]       # 1  P2/4
  - [-1, 3, C2f,      [128, True]]       # 2
  - [-1, 1, Conv,     [256, 3, 2]]       # 3  P3/8
  - [-1, 6, C2f,      [256, True]]       # 4
  - [-1, 1, Conv,     [512, 3, 2]]       # 5  P4/16
  - [-1, 6, C2fDAttn, [512, True]]       # 6  ← Deformable Attention at P4
  - [-1, 1, Conv,     [1024, 3, 2]]      # 7  P5/32
  - [-1, 3, C2fDAttn, [1024, True]]      # 8  ← Deformable Attention at P5
  - [-1, 1, SPPF,     [1024, 5]]         # 9

# Standard YOLOv8 PAN head (unchanged — DAT improvements flow through FPN)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]            # 11  cat backbone P4 (C2fDAttn output)
  - [-1, 3, C2f, [512]]                  # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]            # 14  cat backbone P3
  - [-1, 3, C2f, [256]]                  # 15  (P3/8 — small objects)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]           # 17  cat head P4
  - [-1, 3, C2f, [512]]                  # 18  (P4/16 — medium objects)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]            # 20  cat backbone SPPF
  - [-1, 3, C2f, [1024]]                 # 21  (P5/32 — large objects)

  - [[15, 18, 21], 1, Detect, [nc]]      # 22  Detect(P3, P4, P5)
